name: docs-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check relative Markdown links resolve
        run: python3 scripts/check-links.py

  check-staleness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check suite-level docs don't disagree with sub-project design docs
        run: python3 scripts/check-staleness.py

  check-decision-refs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every prose `decision N` reference resolves
        run: python3 scripts/check-decision-refs.py

  check-doc-conventions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every doc's **Status:** line (DOC-PROTOCOL.md §7.1)
        run: python3 scripts/check-doc-conventions.py
