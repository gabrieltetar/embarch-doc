name: changelog-archive

# Runs scripts/archive-changelog.py on a schedule so old Changelog entries
# don't rely on a human remembering to move them (DOC-PROTOCOL.md §5). Opens
# a PR instead of pushing straight to main — moving doc history is reversible
# either way, but it still deserves a look before it lands.
on:
  schedule:
    - cron: '0 9 * * 1'  # every Monday, 09:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive old changelog entries
        run: python3 scripts/archive-changelog.py
      - name: Open a PR if anything moved
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Archive old changelog entries (scripts/archive-changelog.py)"
          title: "Archive old changelog entries"
          body: >
            Automated run of `scripts/archive-changelog.py` per `DOC-PROTOCOL.md` §5 —
            moves Changelog entries beyond the most recent few into each doc's
            `*.changelog-archive.md` sibling. Review the split, then merge.
          branch: automation/changelog-archive
          delete-branch: true
